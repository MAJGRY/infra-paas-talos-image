# Builds the Talos boot assets on every pull request and publishes them from main and release/*
# as ${TALOS_VERSION}-${REVISION} (GitHub release + installer images in GHCR). A push whose
# release already exists builds nothing. See README.md.
name: build

on:
  pull_request:
  push:
    branches: [main, "release/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck hack/*.sh
      - name: Install crane
        run: |
          hack/install-crane.sh "${RUNNER_TEMP}/bin"
          echo "${RUNNER_TEMP}/bin" >>"${GITHUB_PATH}"
      - name: image.lock matches image.env
        run: hack/resolve.sh --check
      - name: Release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          source image.env
          tag="${TALOS_VERSION}-${REVISION}"
          exists=false
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            exists=true
          fi
          publish=false
          if [[ "${EVENT}" != pull_request && "${exists}" == false ]]; then
            case "${GITHUB_REF}" in
              refs/heads/main | refs/heads/release/*) publish=true ;;
            esac
          fi
          if [[ "${exists}" == true ]]; then
            echo "::notice::release ${tag} exists; bump REVISION in image.env if this change should be published"
          elif [[ "${publish}" == true ]]; then
            echo "::notice::publishing release ${tag}"
          else
            echo "::notice::merging this into main or release/* publishes release ${tag}"
          fi
          echo "publish=${publish}" >>"${GITHUB_OUTPUT}"

  build:
    needs: check
    if: github.event_name == 'pull_request' || needs.check.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: hack/build.sh _out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: talos-assets
          path: |
            _out/release
            _out/installers
          if-no-files-found: error
          retention-days: 3

  publish:
    if: needs.check.outputs.publish == 'true'
    needs: [check, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: talos-assets
          path: _out
      - name: Install crane
        run: |
          hack/install-crane.sh "${RUNNER_TEMP}/bin"
          echo "${RUNNER_TEMP}/bin" >>"${GITHUB_PATH}"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        run: hack/publish.sh _out
